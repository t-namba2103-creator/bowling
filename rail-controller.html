<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>レールクイズ ハンドル</title>
<style>
  /* スマホのハンドル画面（仮デザイン）。横にして両手で持つ */
  :root { --bg: #0f1222; --panel: #191d36; --line: #2c3263; --fg: #f2f4ff; --muted: #a0a7d0; --accent: #ffcc33; --good: #44e08f; --bad: #ff5b72;
    --font: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  main { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; max-width: 900px; margin: 0 auto; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  .state { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: .92rem; }
  .wheelbox { position: relative; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 22px; min-height: 180px; overflow: hidden; }
  .wheel { width: min(56vmin, 300px); aspect-ratio: 1; }
  .side { position: absolute; top: 50%; transform: translateY(-50%); font-size: 2rem; font-weight: 800; color: rgba(255,255,255,.25); }
  .side.l { left: 18px; } .side.r { right: 18px; } .side.on { color: var(--accent); }
  .gate { position: absolute; inset: 0; border: 3px dashed var(--accent); border-radius: 22px; background: #191d36; color: var(--fg); font: inherit; font-size: 1.3rem; font-weight: 800; z-index: 2; }
  .gate small { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-top: 8px; }
  .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.6rem; font-weight: 800; background: rgba(15,18,34,.92); color: var(--accent); pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 3; }
  .big.show { opacity: 1; }
  .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { border: 1px solid var(--line); border-radius: 14px; padding: 12px; font: inherit; font-size: 1rem; font-weight: 700; background: #232953; color: var(--fg); touch-action: manipulation; width: 100%; }
  .btn.go { background: var(--accent); color: #241a00; border-color: var(--accent); }
  .note { color: var(--muted); font-size: .75rem; margin: 0; text-align: center; grid-column: 1 / -1; }
  /* 画面が自動で回らない（縦のまま）のに横に持ったとき: 中身だけ90°回して、横向きで正しく見えるようにする */
  body.rot-cw main, body.rot-ccw main { position: fixed; top: 50%; left: 50%; width: calc(100vh - 24px); height: calc(100vw - 24px); max-width: none; }
  body.rot-cw main { transform: translate(-50%, -50%) rotate(90deg); }
  body.rot-ccw main { transform: translate(-50%, -50%) rotate(-90deg); }
  body.rot-cw .wheel, body.rot-ccw .wheel { width: min(56vw, 260px); }
</style>
</head>
<body>
<main>
  <div class="status"><span><span class="dot" id="dot"></span><span id="conn">通信サーバーに接続中…</span></span><span id="deg">0°</span></div>
  <div class="state" id="state">PCとつないでいます…</div>
  <div class="wheelbox">
    <span class="side l" id="sideL">◀</span><span class="side r" id="sideR">▶</span>
    <svg class="wheel" id="wheel" viewBox="-100 -100 200 200" aria-hidden="true">
      <circle r="88" fill="none" stroke="#ffcc33" stroke-width="16"/>
      <circle r="20" fill="#ffcc33"/>
      <path d="M-80 0 H80 M0 0 V80" stroke="#ffcc33" stroke-width="14" stroke-linecap="round"/>
      <circle cy="-88" r="9" fill="#ff5b72"/>
    </svg>
    <button class="gate" id="gate">タップしてはじめる<small>スマホを横にして、ハンドルのように両手で持ちます（傾きセンサーを使います）</small></button>
    <span class="big" id="big"></span>
  </div>
  <div class="btns">
    <button class="btn" id="centerBtn">まっすぐに合わせる</button>
    <button class="btn go" id="startBtn">スタート / もう一回</button>
    <p class="note">右に傾けると右、左に傾けると左。3択はまっすぐで真ん中。傾きがずれたら「まっすぐに合わせる」</p>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// --- pure:start（スマホの傾き → ハンドルの角度） ---
// g: 重力込みの加速度（端末の座標）。上の向きを、画面の面の中での角度にする。
// 時計回りに回す（右に切る）と、端末から見た「上」は反時計回りに回る → 角度が増える → 右がプラス
// 横持ち・縦持ち・左右どちら向きの横持ちでも、「まっすぐ」に合わせた角度からの差で測るので同じように使える
function upAngle(g) { return Math.atan2(g.y, g.x) * 180 / Math.PI; }
function wrapDeg(d) { return ((d + 540) % 360) - 180; }
function steerFrom(g, center) { return wrapDeg(upAngle(g) - center); }
// 持ち方: 上の端が左（重力の上向きが端末の +x）→ "cw"（中身を時計回りに90°回すと正しく見える）、上の端が右 → "ccw"、縦持ち → ""
// 境目でちらつかないよう、はっきり傾いたときだけ切り替える
function holdMode(g, prev = "") {
  const ax = Math.abs(g.x), ay = Math.abs(g.y);
  if (ax > ay * 1.6) return g.x > 0 ? "cw" : "ccw";
  if (ay > ax * 1.6) return "";
  return prev;
}
// --- pure:end ---

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search), room = params.get("room");
let conn = null, sensorOn = false, center = null, gl = null, steer = 0, lastSend = 0, mode = "";
const buzz = (p) => { try { navigator.vibrate?.(p); } catch { /* 震えない機種もある */ } };

function onMotion(e) {
  const g = e.accelerationIncludingGravity; if (!g || g.x == null) return;
  gl = gl ? { x: gl.x * 0.7 + g.x * 0.3, y: gl.y * 0.7 + g.y * 0.3, z: gl.z * 0.7 + g.z * 0.3 } : { x: g.x, y: g.y, z: g.z };   // 手のふるえをならす
  if (Math.hypot(gl.x, gl.y) < 3) return;          // スマホを寝かせていると傾きが測れない（立てて持つ）
  // 画面が縦のまま（自動で回っていない）なら、持ち方に合わせて中身を回す
  const portrait = window.innerHeight >= window.innerWidth;
  mode = portrait ? holdMode(gl, mode) : "";
  document.body.classList.toggle("rot-cw", mode === "cw"); document.body.classList.toggle("rot-ccw", mode === "ccw");
  if (center == null) center = upAngle(gl);
  steer = steerFrom(gl, center);
  const now = performance.now();
  if (now - lastSend >= 50) { lastSend = now; send({ t: "steer", a: Math.round(steer * 10) / 10 }); }
}
function draw() {
  $("wheel").style.transform = `rotate(${Math.max(-90, Math.min(90, steer))}deg)`;
  $("deg").textContent = `${Math.round(steer)}°`;
  $("sideL").classList.toggle("on", steer < -6); $("sideR").classList.toggle("on", steer > 6);
  requestAnimationFrame(draw);
}
async function enableSensor() {
  if (sensorOn) return true;
  try {
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { $("state").textContent = "傾きセンサーが許可されませんでした。ブラウザの設定から許可してください"; return false; }
    }
    window.addEventListener("devicemotion", onMotion); sensorOn = true; $("gate").hidden = true;
    try { await navigator.wakeLock?.request("screen"); } catch { /* 画面が消えないように（できなくても遊べる） */ }
    return true;
  } catch (e) { $("state").textContent = "センサーを有効にできませんでした: " + e.message; return false; }
}
$("gate").addEventListener("click", async () => { if (await enableSensor()) center = null; });
$("centerBtn").addEventListener("click", () => { if (gl) center = upAngle(gl); buzz(20); });
$("startBtn").addEventListener("click", async () => { await enableSensor(); if (gl) center = upAngle(gl); send({ t: "start" }); });
if (!(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function")) enableSensor();
requestAnimationFrame(draw);

let bigTimer = 0;
function showBig(text) { if (!text) return; const b = $("big"); b.textContent = text; b.classList.add("show"); clearTimeout(bigTimer); bigTimer = setTimeout(() => b.classList.remove("show"), 1300); }
function onFx(d) { if (d.kind === "good") { buzz([40, 30, 40]); showBig(d.text); } else if (d.kind === "crash") { buzz(400); showBig(d.text); } }

function peerOptions() {
  const o = { debug: 0 };
  if (params.get("peerHost")) Object.assign(o, { host: params.get("peerHost"), port: Number(params.get("peerPort") || 443), path: params.get("peerPath") || "/", secure: params.get("peerSecure") !== "0" });
  return o;
}
function setConn(on, text) { $("dot").classList.toggle("on", on); $("conn").textContent = text; }
function send(m) { try { conn?.open && conn.send(m); } catch { /* 切れていたら無視 */ } }
function connect() {
  if (!room) { setConn(false, "部屋番号がありません"); $("state").textContent = "PCの画面のQRコードから開いてください"; return; }
  if (typeof Peer === "undefined") { setConn(false, "通信の部品を読み込めませんでした"); return; }
  const peer = new Peer(undefined, peerOptions());
  peer.on("open", () => {
    setConn(false, "PCを探しています…");
    conn = peer.connect(room, { reliable: true });
    const slow = setTimeout(() => { if (!conn.open) $("state").textContent = "PCと直接つながりません。スマホのWi-Fiを切ってモバイル通信で試してください（PCの←→キーや、体を傾けても遊べます）"; }, 10000);
    conn.on("open", () => { clearTimeout(slow); setConn(true, "PCと接続中"); });
    conn.on("data", (d) => { if (d?.t === "fx") return onFx(d); if (d?.t === "state") $("state").textContent = d.text; });
    conn.on("close", () => setConn(false, "切断されました（再読み込みでつなぎ直し）"));
  });
  peer.on("error", (e) => setConn(false, e.type === "peer-unavailable" ? "PCが見つかりません（PCの画面を確認）" : e.type === "network" || e.type === "server-error" ? "通信サーバーにつながりません" : `接続エラー: ${e.type}`));
}
connect();
window.ctrlTest = { upAngle, steerFrom, holdMode, state: () => ({ connected: !!conn?.open, sensorOn, steer, center, mode, cls: document.body.className }) };
</script>
</body>
</html>

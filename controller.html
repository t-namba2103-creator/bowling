<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ボウリング リモコン</title>
<style>
  /* スマホのリモコン画面（仮デザイン）。画面のほとんどを「押したまま振る」ボタンにする */
  :root { --bg: #0f1222; --panel: #191d36; --line: #2c3263; --fg: #f2f4ff; --muted: #a0a7d0; --accent: #ffcc33; --good: #44e08f; --bad: #ff5b72;
    --font: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif; color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font); user-select: none; -webkit-user-select: none; overscroll-behavior: none;
    padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  main { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 10px; max-width: 520px; margin: 0 auto; }
  .status { display: flex; justify-content: space-between; align-items: center; font-size: .85rem; color: var(--muted); }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--bad); margin-right: 6px; vertical-align: middle; }
  .dot.on { background: var(--good); }
  .state { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: .95rem; min-height: 3em; }
  .hold { position: relative; touch-action: none; border: 0; border-radius: 26px; font: inherit; font-size: 1.35rem; font-weight: 800; color: #241a00; background: var(--accent);
    display: grid; place-items: center; text-align: center; padding: 16px; line-height: 1.6; min-height: 260px; overflow: hidden; }
  .hold small { display: block; font-size: .85rem; font-weight: 400; margin-top: 6px; }
  .hold.holding { background: #ff9d2e; }
  .holdwrap { position: relative; display: grid; min-height: 260px; }
  .gate { position: absolute; inset: 0; border: 3px dashed var(--accent); border-radius: 26px; background: #191d36; color: var(--fg); font: inherit; font-size: 1.4rem; font-weight: 800; z-index: 2; touch-action: manipulation; }
  .gate small { display: block; font-size: .85rem; font-weight: 400; color: var(--muted); margin-top: 8px; }
  .hold:disabled { background: #3a3f6b; color: var(--muted); }
  .big { position: absolute; inset: 0; display: grid; place-items: center; font-size: 2.6rem; font-weight: 800; background: rgba(15,18,34,.92); color: var(--accent); pointer-events: none; opacity: 0; transition: opacity .2s; }
  .big.show { opacity: 1; }
  .last { color: var(--muted); font-size: .88rem; text-align: center; min-height: 1.3em; margin: 0; }
  .btn { border: 1px solid var(--line); border-radius: 14px; padding: 13px; font: inherit; font-size: 1rem; font-weight: 700; background: #232953; color: var(--fg); touch-action: manipulation; width: 100%; }
  .btn.small { font-size: .85rem; padding: 10px; }
  .btn[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
  details { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; }
  details summary { color: var(--muted); font-size: .85rem; cursor: pointer; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .note { color: var(--muted); font-size: .75rem; margin: 6px 0 0; text-align: center; }
</style>
</head>
<body>
<main>
  <div class="status"><span><span class="dot" id="dot"></span><span id="conn">通信サーバーに接続中…</span></span><span id="who"></span></div>
  <div class="state" id="state">PCとつないでいます…</div>
  <div class="holdwrap">
  <button class="gate" id="gate">タップしてはじめる<small>スマホの動きのセンサーを使います（許可を聞かれたら「許可」）</small></button>
  <button class="hold" id="hold" disabled>
    <span>ここを押したまま<br>後ろに振って → 前へ振って<br>指を離すと投げる<small>強く振るほど速い ・ 離す瞬間に手首をひねるとカーブ</small></span>
    <span class="big" id="big"></span>
  </button>
  </div>
  <div style="display:grid; gap:8px">
    <p class="last" id="last"></p>
    <button class="btn" id="startBtn">スタート / もう一回</button>
    <details>
      <summary>設定・うまくいかないとき</summary>
      <div class="grid2">
        <button class="btn small" id="sensorBtn">センサーを有効にする</button>
        <button class="btn small" id="testBtn">直前の振りを確認</button>
        <button class="btn small" id="invertSpinBtn" aria-pressed="false">カーブの向きを反転</button>
      </div>
      <p class="note">ストラップに手首を通してから振ってください。周りに人がいないか確認しましょう。</p>
    </details>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// --- pure:start（スマホの動きのデータから、投げた強さとカーブを計算する） ---
// samples: [{t, r:{alpha,beta,gamma}（回転の速さ 度/秒。alpha=z軸 beta=x軸 gamma=y軸まわり）, g:{x,y,z}（重力込みの加速度）, a:{x,y,z}（重力抜きの加速度）}]
// 狙い（立ち位置）は PC のカメラで決める。スマホは強さ・カーブ・バックスイングだけを見る
// tGrip: ボタンを押した時刻、tRel: 指を離した時刻
const dot3 = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
const norm3 = (u) => Math.hypot(u[0], u[1], u[2]);
const omega = (s) => (s.r ? [s.r.beta || 0, s.r.gamma || 0, s.r.alpha || 0] : null); // 端末の (x, y, z) 軸まわりの回転
const cross3 = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit3 = (v) => { const n = norm3(v); return n > 0 ? v.map((c) => c / n) : v; };
function analyzeSwing(samples, tGrip, tRel, opt = {}) {
  const o = { needBack: true, invertSpin: false, ...opt };
  const held = samples.filter((s) => s.t >= tGrip - 50 && s.t <= tRel);
  const win = held.filter((s) => s.t >= tRel - 300);
  if (win.length < 3) return { ok: false, reason: "振りを読み取れませんでした（センサーが有効か確認してください）" };
  const gyro = win.some((s) => omega(s) && norm3(omega(s)) > 0);
  if (!gyro) {
    // ジャイロがない機種: 加速度の大きさだけで強さを決める（カーブ・バックスイングは見ない）
    const vals = win.map((s) => (s.g ? Math.abs(norm3([s.g.x || 0, s.g.y || 0, s.g.z || 0]) - 9.8) : 0)).sort((a, b) => b - a);
    const raw = vals[Math.min(2, vals.length - 1)];                                       // 3番目に大きい値（1回だけの飛び値を使わない）
    const speed = Math.min(1, Math.max(0, (raw - 4) / 20));
    return speed > 0 ? { ok: true, speed, spin: 0, speedRaw: raw, gyro: false } : { ok: false, reason: "もう少し強く振ってください", speedRaw: raw };
  }
  // 強さ: 離す直前0.3秒の回転の速さ。1回だけの飛び値（センサーのノイズ）に左右されないよう、上から3番目までの平均
  const ws = win.filter((s) => omega(s)), mags = ws.map((s) => norm3(omega(s))).sort((a, b) => b - a);
  const pv = mags.slice(0, 3).reduce((m, v) => m + v, 0) / Math.min(3, mags.length);
  const speed = Math.min(1, Math.max(0, (pv - 150) / 650));
  if (speed <= 0) return { ok: false, reason: "もう少し強く振ってください", speedRaw: pv };
  // 前に振る回転の軸: 速く回っていたサンプルの回転の向きの平均
  const fast = ws.filter((s) => norm3(omega(s)) >= pv * 0.6), ref = omega(fast[0] || ws[0]);
  const axis = unit3(fast.reduce((m, s) => { const w = omega(s), sg = dot3(w, ref) >= 0 ? 1 : -1; return [m[0] + sg * w[0], m[1] + sg * w[1], m[2] + sg * w[2]]; }, [0, 0, 0]));
  const peakT = fast.length ? fast[0].t : win[0].t;
  if (o.needBack) {
    const before = held.filter((s) => s.t < peakT && omega(s));
    const backMin = Math.min(0, ...before.map((s) => dot3(omega(s), axis)));
    if (backMin > -100) return { ok: false, reason: "後ろに振ってから、前へ振って離してください", speedRaw: pv };
  }
  // カーブ: 離す瞬間の手首のひねり = 鉛直（重力の向き）まわりの回転。
  // 鉛直の向きは「ボタンを押した直後（スマホがほぼ止まっている）の重力の向き」を、ジャイロの回転で追いかけて求める。
  // （振っている最中の加速度センサーは振る力が混ざって重力の向きが狂いやすいため。機種による差も出にくい）
  const g0s = held.filter((s) => s.g && s.t <= tGrip + 250 && (!omega(s) || norm3(omega(s)) < 80));
  const gsrc = g0s.length ? g0s : held.filter((s) => s.g).slice(0, 3);
  let up = gsrc.length ? unit3(gsrc.reduce((m, s) => { const v = s.a ? [s.g.x - (s.a.x || 0), s.g.y - (s.a.y || 0), s.g.z - (s.a.z || 0)] : [s.g.x, s.g.y, s.g.z]; return [m[0] + v[0], m[1] + v[1], m[2] + v[2]]; }, [0, 0, 0])) : null;
  let twist;
  if (up && norm3(up) > 0) {
    const t0 = gsrc.length ? gsrc[gsrc.length - 1].t : held[0].t, D2R = Math.PI / 180;
    let lastT = t0, sum = 0, n = 0;
    for (const s of held) {
      const w = omega(s); if (!w || s.t <= t0) continue;
      const dt = Math.min(0.05, (s.t - lastT) / 1000); lastT = s.t;
      const wr = w.map((c) => c * D2R), d = cross3(wr, up);                                  // 世界に固定した向きは、端末から見ると -ω×v で回る
      up = unit3([up[0] - d[0] * dt, up[1] - d[1] * dt, up[2] - d[2] * dt]);
      if (s.t >= tRel - 150) { sum += dot3(w, up); n++; }
    }
    twist = n ? sum / n : 0;
  } else {
    const last = win.filter((s) => s.t >= tRel - 150 && omega(s));
    twist = last.reduce((m, s) => m + omega(s)[1], 0) / Math.max(1, last.length);      // 重力が取れない機種: スマホの長い方の軸まわり
  }
  let spin = Math.max(-1, Math.min(1, -twist / 350));                                     // 上から見て時計回りのひねり → 右へ曲がる
  if (Math.abs(spin) < 0.15) spin = 0;                                                    // 少しのひねり（ノイズ）ではカーブしない
  if (o.invertSpin) spin = -spin;
  return { ok: true, speed, spin, speedRaw: pv, gyro: true };
}
// --- pure:end ---

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search), room = params.get("room");
const samples = []; let holding = false, gripT = 0, conn = null, canThrow = false;
const load = (k) => { try { return localStorage.getItem(k) === "1"; } catch { return false; } };
const save = (k, v) => { try { localStorage.setItem(k, v ? "1" : "0"); } catch { /* 保存できなくても使える */ } };
const opt = { invertSpin: load("bowl-invert") };
$("invertSpinBtn").setAttribute("aria-pressed", String(opt.invertSpin));
const buzz = (p) => { try { navigator.vibrate?.(p); } catch { /* 震えない機種もある（iPhone など） */ } };

// ---- センサー ----
function onMotion(e) {
  const r = e.rotationRate, g = e.accelerationIncludingGravity, a = e.acceleration;
  samples.push({ t: performance.now(), r: r ? { alpha: r.alpha, beta: r.beta, gamma: r.gamma } : null,
    g: g && g.x != null ? { x: g.x, y: g.y, z: g.z } : null, a: a && a.x != null ? { x: a.x, y: a.y, z: a.z } : null });
  while (samples.length && samples[0].t < performance.now() - 3000) samples.shift();
}
let sensorOn = false;
async function enableSensor() {
  if (sensorOn) return true;
  try {
    // iPhone（と最近の Chrome）は、ボタンを押したときに許可を求める必要がある
    if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") {
      const r = await DeviceMotionEvent.requestPermission();
      if (r !== "granted") { $("last").textContent = "動きのセンサーが許可されませんでした。ブラウザの設定から許可してください"; return false; }
    }
    window.addEventListener("devicemotion", onMotion); sensorOn = true; $("gate").hidden = true;
    $("sensorBtn").textContent = "センサー有効"; $("sensorBtn").disabled = true;
    try { await navigator.wakeLock?.request("screen"); } catch { /* 画面が消えないようにする（できなくても遊べる） */ }
    return true;
  } catch (e) { $("last").textContent = "センサーを有効にできませんでした: " + e.message; return false; }
}
$("sensorBtn").addEventListener("click", enableSensor);
$("gate").addEventListener("click", enableSensor);
// 許可がいらない機種（多くの Android）は、開いたらすぐ有効にする
if (!(typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function")) enableSensor();

// ---- 投げる（押している間ボールを握る、離すと投げる） ----
const hold = $("hold");
hold.addEventListener("pointerdown", (e) => {
  if (!canThrow) return;
  if (!sensorOn) return;                                // センサーが有効になるまでは「タップしてはじめる」が上にかぶさっている
  holding = true; gripT = performance.now(); hold.classList.add("holding");
  try { hold.setPointerCapture(e.pointerId); } catch { /* 指が外れても離したときに投げられるように */ }
  buzz(15); send({ t: "grip", on: true });
});
function release() {
  if (!holding) return; holding = false; hold.classList.remove("holding");
  const r = analyzeSwing(samples, gripT, performance.now(), opt);
  if (!r.ok) { $("last").textContent = r.reason; buzz([30, 40, 30]); send({ t: "grip", on: false }); return; }
  send({ t: "throw", speed: r.speed, spin: r.spin });
  $("last").textContent = `強さ ${Math.round(r.speed * 100)}% ・ カーブ ${r.spin > 0 ? "右" : r.spin < 0 ? "左" : "なし"}`;
}
hold.addEventListener("pointerup", release); hold.addEventListener("pointercancel", release);
$("startBtn").addEventListener("click", async () => { await enableSensor(); send({ t: "start" }); });
$("invertSpinBtn").addEventListener("click", () => { opt.invertSpin = !opt.invertSpin; $("invertSpinBtn").setAttribute("aria-pressed", String(opt.invertSpin)); save("bowl-invert", opt.invertSpin); });
$("testBtn").addEventListener("click", () => {
  const t = performance.now(), r = analyzeSwing(samples, t - 2500, t, { ...opt, needBack: false });
  $("last").textContent = r.speedRaw != null ? `直前の振り: ${Math.round(r.speedRaw)}${r.gyro === false ? "（加速度）" : " 度/秒"}${r.ok ? `・カーブ ${r.spin.toFixed(2)}` : ""}` : r.reason;
});

// ---- 手応え（PCから届く） ----
let bigTimer = 0;
function showBig(text) { if (!text) return; const b = $("big"); b.textContent = text; b.classList.add("show"); clearTimeout(bigTimer); bigTimer = setTimeout(() => b.classList.remove("show"), 1400); }
function onFx(d) {
  if (d.kind === "throw") buzz(40);
  else if (d.kind === "hit") buzz([60, 30, 120]);
  else if (d.kind === "strike") { buzz([100, 50, 100, 50, 250]); showBig(d.text); }
  else if (d.kind === "spare") { buzz([80, 40, 160]); showBig(d.text); }
  else if (d.kind === "gutter") { buzz(300); showBig(d.text); }
  else showBig(d.text);
}

// ---- PC とつなぐ（どの段階で止まっているか表示する） ----
function peerOptions() {
  const o = { debug: 0 };
  if (params.get("peerHost")) Object.assign(o, { host: params.get("peerHost"), port: Number(params.get("peerPort") || 443), path: params.get("peerPath") || "/", secure: params.get("peerSecure") !== "0" });
  return o;
}
function setConn(on, text) { $("dot").classList.toggle("on", on); $("conn").textContent = text; }
function send(m) { try { conn?.open && conn.send(m); } catch { /* 切れていたら無視 */ } }
function connect() {
  if (!room) { setConn(false, "部屋番号がありません"); $("state").textContent = "PCの画面のQRコードから開いてください"; return; }
  if (typeof Peer === "undefined") { setConn(false, "通信の部品を読み込めませんでした"); return; }
  const peer = new Peer(undefined, peerOptions());
  peer.on("open", () => {
    setConn(false, "PCを探しています…");
    conn = peer.connect(room, { reliable: true });
    // 10秒たってもつながらなければ、原因の候補を出す（エラーが出ないまま止まることがあるため）
    const slow = setTimeout(() => { if (!conn.open) $("state").textContent = "PCと直接つながりません。Wi-Fiが端末どうしの通信を止めている可能性があります。スマホのWi-Fiを切ってモバイル通信で試してください"; }, 10000);
    conn.on("open", () => { clearTimeout(slow); setConn(true, "PCと接続中"); send({ t: "hello" }); });
    conn.on("data", (d) => {
      if (d?.t === "fx") return onFx(d);
      if (d?.t !== "state") return;
      $("state").textContent = d.text; canThrow = !!d.canThrow; hold.disabled = !canThrow; $("who").textContent = d.you || "";
    });
    conn.on("close", () => { setConn(false, "切断されました（再読み込みでつなぎ直し）"); hold.disabled = true; canThrow = false; });
  });
  peer.on("error", (e) => setConn(false, e.type === "peer-unavailable" ? "PCが見つかりません（PCの画面を確認）" : e.type === "network" || e.type === "server-error" ? "通信サーバーにつながりません" : `接続エラー: ${e.type}`));
}
connect();
window.ctrlTest = { analyzeSwing, samples, state: () => ({ canThrow, connected: !!conn?.open, sensorOn, big: $("big").textContent }) };
</script>
</body>
</html>
